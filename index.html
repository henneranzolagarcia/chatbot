<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <h1 class="clase-titulo">
    Hola Mundo. Me llamo Alejandro.
  </h1>
  <p class="clase-parrafo" id="parrafo-llm">
    Acá va a aparecer el texto que recibimos de nuestro servidor. 
  </p>
  <button id="boton-accionador">
    ACEPTAR
  </button>
  <input type="Ingrese Texto" id="input-prompt">
  <a href="https://www.google.com">Ir a google.com</a>
  <img src="" alt="">
  <script>
    document.getElementById("boton-accionador").onclick = async () => {
      const prompt = document.getElementById("input-prompt").value;
      const res = await fetch("http://localhost:8000/chat/"+prompt)
      const datos = await res.json()
      document.getElementById("parrafo-llm").textContent = datos.Respuesta
    }
    
    </script>
</body>
</html>
